name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: local

jobs:
  restls:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, go: '1.20' }
          - { os: ubuntu-latest, go: '1.24' }
          - { os: ubuntu-latest, go: '1.26' }
          - { os: windows-latest, go: '1.26' }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Preserve test fixture line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ matrix.go }}
      - run: go build ./...
      - name: Vet
        if: matrix.go == '1.26'
        run: go vet -loopclosure=false ./...
      - name: Full TLS and ResTLS tests
        run: go test -count=1 -timeout 5m ./...

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26'
      - name: Full TLS and ResTLS tests with race detector
        run: go test -race -count=3 -timeout 5m ./...
